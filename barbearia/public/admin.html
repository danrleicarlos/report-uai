<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0d0b">
  <title>Barber POP · Admin</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="a-shell">
    <aside class="a-side">
      <div class="logo"><span class="brand-mark">B</span><div><div class="brand" id="shop">Barber POP</div><div class="faint tiny">Painel administrativo</div></div></div>
      <nav id="nav"></nav>
      <div class="spacer"></div>
      <div class="card card-tight small">
        <div class="muted tiny">Conectado como</div>
        <div id="me-name" style="font-weight:600"></div>
        <div class="row" style="margin-top:8px;gap:6px">
          <button class="btn btn-sm grow" id="pw">Senha</button>
          <button class="btn btn-sm btn-bad grow" id="out">Sair</button>
        </div>
      </div>
    </aside>
    <div>
      <header class="topbar a-mobile-top">
        <span class="brand-mark" style="width:32px;height:32px;font-size:16px">B</span>
        <div class="title grow"><span class="brand" id="shop-m">Barber POP</span><span class="muted tiny">Admin</span></div>
        <button class="icon-btn" id="menu-m" aria-label="Menu">☰</button>
      </header>
      <main class="a-main">
        <div id="alerts"></div>
        <div id="view"></div>
      </main>
    </div>
  </div>
  <nav class="a-tabbar" id="tabbar"></nav>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
