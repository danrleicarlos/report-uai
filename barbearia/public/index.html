<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0d0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Barber POP · Entrar</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-head">
        <div class="brand-mark">B</div>
        <h1 class="brand" id="shop">Barber POP</h1>
        <div class="divider-gold"></div>
        <div class="muted small">Registro de atendimentos e padrão de qualidade</div>
      </div>
      <form id="form" class="card" autocomplete="on">
        <div id="msg"></div>
        <div class="field">
          <label for="usuario">Usuário</label>
          <input class="input" id="usuario" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input class="input" id="senha" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-gold btn-lg btn-block" id="go" type="submit">Entrar</button>
      </form>
      <p class="faint tiny" style="text-align:center;margin-top:18px">Esqueceu a senha? Peça ao administrador para definir uma nova.</p>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script>
    (async function () {
      const { api, esc } = BP;
      const msg = document.getElementById('msg');
      const go = (u) => { location.href = u.papel === 'admin' ? '/admin' : '/barbeiro'; };
      if (new URLSearchParams(location.search).get('expirou')) {
        msg.innerHTML = '<div class="alert alert-warn">Sua sessão expirou. Entre novamente.</div>';
      }
      try { const me = await api('GET', '/api/me'); go(me.usuario); return; } catch (e) { /* não logado */ }
      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('go');
        btn.disabled = true; btn.textContent = 'Entrando…';
        try {
          const r = await api('POST', '/api/login', {
            usuario: document.getElementById('usuario').value,
            senha: document.getElementById('senha').value,
          });
          go(r.usuario);
        } catch (err) {
          msg.innerHTML = `<div class="alert alert-bad">${esc(err.message)}</div>`;
          btn.disabled = false; btn.textContent = 'Entrar';
        }
      });
    })();
  </script>
</body>
</html>
