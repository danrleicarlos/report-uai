<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ficha de Atleta WD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Ficha de qualificação gamificada para a consultoria online Wilkson Dias Personal Trainer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,500;0,700;0,800;1,700;1,800&family=Barlow:wght@300;400;500;600&display=swap">
<style>
/* Layout: one-column "game cartridge" centered on preto premium, sticky HUD with XP + phase track, one question per screen. Single dark look by brand choice. */
:root{
  --bg:#ffffff;           /* fundo branco */
  --surface:#f7f5f0;      /* cartões e campos, viés quente */
  --surface-2:#ebe7dd;
  --rule:#e3dfd5;
  --black:#111111;        /* preto premium */
  --fg:#111111;
  --fg-soft:#3b372f;
  --sun:#F5B400;          /* amarelo performance */
  --sun-deep:#d9a000;
  --sun-ink:#946800;      /* amarelo escurecido p/ texto pequeno sobre branco */
  --sun-tint:#fff7df;
  --sun-glow:rgba(245,180,0,.22);
  --muted:#6b665b;
  --dim:#8f897d;
  --danger:#c43d27;
  --display:"Saira","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
/* diagonais do universo gráfico */
.stripes{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(245,180,0,.22) 22px 23px);
  -webkit-mask-image:linear-gradient(100deg,transparent 35%,#000 85%);mask-image:linear-gradient(100deg,transparent 35%,#000 85%)}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:580px;margin:0 auto}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 75%,rgba(255,255,255,0));padding-block:14px 18px}
.hud[hidden]{display:none!important}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hud-sym{height:22px;width:auto;display:block}
.xp{display:flex;align-items:baseline;gap:8px;font-family:var(--display);position:relative}
.xp-lvl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.xp-num{font-weight:800;font-style:italic;font-size:22px;color:var(--sun-ink);font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:right}
.xp-unit{font-size:12px;font-weight:700;color:var(--sun-ink);letter-spacing:.08em}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.seg{height:5px;background:var(--surface-2);border-radius:1px;overflow:hidden;transform:skewX(-20deg)}
.seg i{display:block;height:100%;width:0;background:var(--sun);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hud-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hud-meta b{color:var(--fg);font-weight:600}

/* Stage */
.stage{flex:1;display:flex;flex-direction:column;padding-block:8px 40px}
.screen{display:flex;flex-direction:column;gap:22px;animation:enter .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--sun-ink)}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(34px,8.5vw,52px)}
h2{font-size:clamp(25px,6.2vw,34px)}
.sub{color:var(--muted);margin:-10px 0 0;font-size:16px}
.q-num{font-family:var(--display);font-style:italic;font-weight:800;color:var(--sun-ink);font-size:15px;letter-spacing:.06em}

/* Intro */
.intro{padding-top:min(8vh,64px);gap:26px}
.intro-logo{width:min(250px,70%);height:auto;display:block}
.intro p.lead{font-size:18px;color:var(--fg-soft);margin:0;max-width:44ch;font-weight:300}
.intro p.lead strong{color:var(--fg);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0;padding:16px 0;border-block:1px solid var(--rule)}
.stats div{display:flex;flex-direction:column}
.stats dt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);order:2}
.stats dd{margin:0;font-family:var(--display);font-weight:800;font-style:italic;font-size:24px;color:var(--sun-ink);order:1}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* Buttons */
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--sun);color:var(--black);padding:16px 26px;border-radius:3px;display:inline-flex;align-items:center;gap:10px;text-decoration:none;
  transition:transform .15s,background .15s,box-shadow .2s;box-shadow:0 0 0 0 var(--sun-glow)}
.btn:hover{background:#ffc21a;box-shadow:0 0 0 6px var(--sun-glow)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:disabled{background:var(--surface-2);color:var(--dim);cursor:not-allowed;box-shadow:none}
.btn .arr{display:inline-block;transition:transform .2s}
.btn:hover .arr{transform:translateX(3px)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--rule);font-weight:700}
.btn-ghost:hover{background:var(--surface);box-shadow:none;border-color:var(--dim)}
.link{appearance:none;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--fg)}
.back{appearance:none;background:none;border:0;color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:6px 0;align-self:flex-start}
.back:hover{color:var(--sun-ink)}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}

/* Options */
.opts{display:grid;gap:10px}
.opt{appearance:none;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--rule);color:var(--fg);font:inherit;font-size:17px;line-height:1.3;
  padding:15px 16px;border-radius:4px;transition:border-color .15s,background .15s,transform .15s}
.opt:hover{border-color:var(--sun-deep);background:var(--sun-tint)}
.opt:active{transform:scale(.99)}
.opt .k{flex:none;width:28px;height:28px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-style:italic;font-size:14px;
  color:var(--sun);border:1px solid var(--rule);border-radius:2px;transform:skewX(-8deg)}
.opt[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--black);font-weight:500}
.opt[aria-pressed="true"] .k{background:var(--black);color:var(--sun);border-color:var(--black)}
.opts.row{grid-template-columns:repeat(4,1fr)}
.opts.row .opt{flex-direction:column;justify-content:center;font-family:var(--display);font-weight:800;font-style:italic;font-size:34px;padding:18px 8px;gap:2px}
.opts.row .opt small{font-family:var(--body);font-style:normal;font-weight:400;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.opts.row .opt .k{display:none}
.multi-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.counter{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--muted);text-transform:uppercase}
.counter b{color:var(--sun-ink)}

/* Scale */
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
.scale .opt{justify-content:center;padding:14px 0;font-family:var(--display);font-weight:800;font-style:italic;font-size:20px}
.scale .opt .k{display:none}
.scale-ends{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-top:-12px}
.heat{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--surface-2),var(--sun-deep) 60%,var(--sun));margin-top:-14px;opacity:.8}

/* Reaction line */
.react{min-height:26px;display:flex;align-items:center;gap:10px;font-size:16px;color:var(--sun-ink);font-weight:500;opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.react.on{opacity:1;transform:none}
.react .pill{font-family:var(--display);font-weight:800;font-style:italic;font-size:13px;letter-spacing:.06em;background:var(--sun);color:var(--black);padding:2px 8px;border-radius:2px}

/* Fields */
.fields{display:grid;gap:18px}
.field{display:grid;gap:6px}
.field label{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.field label em{font-style:normal;color:var(--dim);letter-spacing:.08em;text-transform:none;font-family:var(--body);font-weight:400}
.field input,.field textarea{width:100%;background:var(--surface);border:1px solid var(--rule);border-bottom:2px solid var(--rule);color:var(--fg);font:inherit;font-size:18px;
  padding:13px 14px;border-radius:3px;transition:border-color .15s}
.field textarea{min-height:130px;resize:vertical;line-height:1.45}
.field input::placeholder,.field textarea::placeholder{color:var(--dim)}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--rule);border-bottom-color:var(--sun-deep);background:#fff}
.field .err{font-size:13px;color:var(--danger);min-height:0}
.field.bad input{border-bottom-color:var(--danger)}
.two{display:grid;grid-template-columns:1fr 110px;gap:12px}
.two > *{min-width:0}

/* Phase cleared */
.cleared{padding-top:min(7vh,56px);gap:20px}
.big-num{font-family:var(--display);font-weight:800;font-style:italic;color:var(--sun);font-size:clamp(78px,22vw,132px);line-height:.85;letter-spacing:-.03em}
.cleared .line{font-size:19px;color:var(--fg-soft);max-width:40ch;margin:0;font-weight:300}
.bonus{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);padding:7px 12px;border-radius:2px;font-size:14px}
.chip b{font-family:var(--display);font-style:italic;font-weight:800;color:var(--sun-ink)}
.chip.badge{border-color:var(--sun-deep)}
.chip.badge::before{content:"";width:8px;height:8px;background:var(--sun);transform:rotate(45deg)}

/* Result card */
.card{background:var(--bg);box-shadow:0 14px 40px rgba(17,17,17,.08);border:1px solid var(--rule);border-radius:6px;overflow:hidden;position:relative}
.card-top{background:var(--sun);color:var(--black);padding:18px 20px 16px;position:relative;overflow:hidden}
.card-top::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(17,17,17,.07) 14px 15px)}
.card-top > *{position:relative;z-index:1}
.card-kicker{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.18em;white-space:nowrap;text-transform:uppercase}
.card-name{font-family:var(--display);font-weight:800;font-style:italic;font-size:clamp(28px,7vw,40px);line-height:1;margin:10px 0 4px;text-transform:uppercase;overflow-wrap:anywhere}
.card-profile{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase}
.card-body{padding:18px 20px 20px;display:grid;gap:16px}
.card-desc{margin:0;color:var(--fg-soft);font-size:16px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.stat{background:var(--bg);padding:12px 14px;min-width:0}
.stat dt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.stat dd{margin:3px 0 0;font-weight:500;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.meter{display:flex;gap:3px;margin-top:6px}
.meter i{flex:1;height:8px;background:var(--surface-2);transform:skewX(-20deg)}
.meter i.on{background:var(--sun)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:14px;border-top:1px dashed var(--rule)}
.card-foot .xpbig{font-family:var(--display);font-weight:800;font-style:italic;font-size:28px;color:var(--sun-ink);font-variant-numeric:tabular-nums}
.card-foot .xpbig span{font-size:13px;letter-spacing:.12em;color:var(--muted);font-style:normal;margin-left:6px}
.card-foot .code{font-family:var(--display);font-weight:700;letter-spacing:.18em;font-size:13px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:14px;color:var(--muted);margin:0}
.mailst{color:var(--sun-ink);font-weight:500}
.footer{padding-block:20px 28px;display:flex;justify-content:center}
.footer img{height:40px;width:auto;opacity:.85}

/* Toast + XP float */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 60px));visibility:hidden;z-index:40;
  background:var(--black);color:#fff;padding:10px 16px 10px 12px;border-radius:3px;display:flex;align-items:center;gap:10px;
  font-weight:600;font-size:15px;box-shadow:0 10px 30px rgba(17,17,17,.25);transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);visibility:visible;transition-delay:0s}
.toast .ic{width:26px;height:26px;background:var(--sun);display:grid;place-items:center;transform:rotate(45deg);flex:none}
.toast .ic span{transform:rotate(-45deg);color:var(--black);font-family:var(--display);font-weight:800;font-size:13px}
.toast small{display:block;font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#bdb6a8}
.float{position:absolute;right:0;top:100%;font-family:var(--display);font-weight:800;font-style:italic;color:var(--sun-ink);font-size:16px;pointer-events:none;animation:float 1s ease-out forwards;white-space:nowrap}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}

@media (max-width:480px){
  .scale{grid-template-columns:repeat(6,1fr)}
  .opts.row .opt{font-size:28px}
  .opt{font-size:16px;padding:14px}
  .two{grid-template-columns:1fr 92px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>

const LEVELS = [[0, "Iniciante"], [300, "Aquecido"], [700, "Em ritmo"], [1100, "Alta performance"]];

  intenso:   { name: "Alta performance",       desc: "Disposição você tem de sobra. O próximo nível vem de ajuste fino e periodização." }
};
const BADGES = {
  checkin:  { name: "Ficha aberta",        test: a => !!a.checkin },
  foco:     { name: "Modo foco",           test: a => a.urgencia != null && a.urgencia >= 8 },
  sincero:  { name: "Sinceridade máxima",  test: a => Array.isArray(a.chefoes) && a.chefoes.length > 0 },
  recado:   { name: "Recado entregue",     test: a => typeof a.recado === "string" && a.recado.trim().length > 0 },
  completa: { name: "Ficha completa",      test: (a, s) => s.finished }
};
const STORE_KEY = "wd-ficha-v1";
const GENERIC_R = ["Anotado.", "Boa.", "Registrado.", "Isso ajuda muito."];

/* ---------- estado ---------- */
let S = { screen: "intro", qi: 0, answers: {}, cleared: [], finished: false, sent: false, mailed: false, code: null };
let shownXP = 0, lock = false;
const $ = s => document.querySelector(s);
const stage = $("#stage");
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(STORE_KEY); } catch (e) {} }

/* ---------- XP / nível / badges ---------- */
function totalXP(st = S) {
  let xp = 0;
  for (const q of Q) {
    const v = st.answers[q.id];
    if (v == null) continue;
    if (q.type === "text") { if (String(v).trim()) xp += q.bonus; }
    else if (!(Array.isArray(v) && !v.length)) xp += q.xp;
  }
  xp += st.cleared.length * PHASE_BONUS;
  if (st.finished) xp += PHASE_BONUS;
  return xp;
}
function level(xp) { let l = LEVELS[0][1]; for (const [t, n] of LEVELS) if (xp >= t) l = n; return l; }
function earned(st = S) { return Object.keys(BADGES).filter(k => BADGES[k].test(st.answers, st)); }

function animateXP() {
  const target = totalXP(), from = shownXP, el = $("#xp"), t0 = performance.now(), dur = 600;
  $("#lvl").textContent = level(target);
  if (target === from) { el.textContent = target; return; }
  if (target > from) {
    const f = document.createElement("span"); f.className = "float"; f.textContent = "+" + (target - from) + " XP";
    $(".xp").appendChild(f); setTimeout(() => f.remove(), 1000);
  }
  (function tick(now) {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (target - from) * e);
    if (p < 1) requestAnimationFrame(tick);
  })(t0);
  shownXP = target;
}

let toastTimer;
function toast(title, kicker = "Conquista desbloqueada") {
  const t = $("#toast");
  t.innerHTML = `<span class="ic"><span>★</span></span><span><small>${esc(kicker)}</small>${esc(title)}</span>`;
  t.classList.add("on"); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}
function withBadgeCheck(fn) {
  const before = new Set(earned());
  fn();
  const fresh = earned().filter(k => !before.has(k));
  fresh.forEach((k, i) => setTimeout(() => toast(BADGES[k].name), 350 + i * 2700));
}

/* ---------- HUD ---------- */
function renderHUD() {
  const hud = $("#hud");
  hud.hidden = S.screen === "intro";
  $("#foot").hidden = S.screen !== "result";
  if (hud.hidden) return;
  const q = Q[S.qi];
  const phase = S.screen === "result" ? 4 : (S.screen === "cleared" ? S.clearedPhase : q.phase);
  const track = $("#track");
  if (!track.children.length) track.innerHTML = PHASES.map(() => '<div class="seg"><i></i></div>').join("");
  PHASES.forEach((_, p) => {
    const qs = Q.filter(x => x.phase === p);
    const done = qs.filter(x => S.answers[x.id] != null).length;
    let pct = done / qs.length;
    if (S.screen === "question" && p === q.phase && S.answers[q.id] == null) pct = Math.max(pct, (done + .35) / qs.length);
    track.children[p].firstChild.style.width = Math.round(Math.min(1, pct) * 100) + "%";
  });
  $("#phNum").textContent = phase + 1;
  $("#phName").textContent = PHASES[phase].name;
  const answerable = Q.length - 1; // check-in não conta como pergunta
  const idx = Q.filter((x, i) => i <= S.qi && x.type !== "checkin").length;
  $("#qCount").textContent = S.screen === "question" && q.type !== "checkin" ? `${idx}/${answerable}` : "";
}

  renderHUD();
  if (S.screen === "intro") return renderIntro();
  if (S.screen === "cleared") return renderCleared();
  if (S.screen === "result") return renderResult();
  const q = Q[S.qi];
  ({ checkin: renderCheckin, single: renderSingle, multi: renderMulti, scale: renderScale, text: renderText })[q.type](q);
}

}

    <div class="eyebrow">Ficha de atleta · Consultoria online</div>
    <h1>Antes do treino, o diagnóstico.</h1>
    <p class="lead">Responda rapidinho, ganhe <strong>XP</strong> a cada resposta e destrave seu <strong>perfil de atleta</strong>. Com ele, o Wilkson monta uma proposta feita pra sua rotina.</p>
    <dl class="stats">
      <div><dt>Fases</dt><dd>5</dd></div>
      <div><dt>Perguntas</dt><dd>${Q.length - 1}</dd></div>
      <div><dt>Minutos</dt><dd>~3</dd></div>
      <div><dt>XP em jogo</dt><dd>${maxXP()}</dd></div>
    </dl>
    <div class="actions">
      <button class="btn" id="start" type="button">${canResume ? "Recomeçar" : "Começar"} <span class="arr">→</span></button>
      ${canResume ? '<button class="btn btn-ghost" id="resume" type="button">Continuar de onde parei</button>' : ""}
    </div>
  </section>`;
  $("#start").onclick = () => { clearSave(); S = { screen: "question", qi: 0, answers: {}, cleared: [], finished: false, sent: false, mailed: false, code: null }; shownXP = 0; $("#xp").textContent = "0"; go("question"); };
  if (canResume) $("#resume").onclick = () => { S = saved; shownXP = 0; render(); animateXP(); };
}
function maxXP() {
  return Q.reduce((s, q) => s + (q.type === "text" ? q.bonus : q.xp), 0) + PHASES.length * PHASE_BONUS;
}

function renderCheckin(q) {
  const a = S.answers.checkin || {};
  stage.innerHTML = `<section class="screen">${head(q)}
    <form class="fields" id="f" novalidate>
      <div class="two">
        <div class="field" data-f="nome"><label for="nome">Nome</label><input id="nome" autocomplete="given-name" placeholder="Como você gosta de ser chamado(a)" value="${esc(a.nome || "")}"><div class="err"></div></div>
        <div class="field" data-f="idade"><label for="idade">Idade</label><input id="idade" inputmode="numeric" maxlength="2" placeholder="00" value="${esc(a.idade || "")}"><div class="err"></div></div>
      </div>
      <div class="field" data-f="prof"><label for="prof">Com o que você trabalha?</label><input id="prof" autocomplete="organization-title" placeholder="Ex.: enfermeira, advogado, autônoma" value="${esc(a.prof || "")}"><div class="err"></div></div>
      <div class="field" data-f="whats"><label for="whats">WhatsApp</label><input id="whats" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(00) 00000-0000" value="${esc(a.whats || "")}"><div class="err"></div></div>
      <div class="field" data-f="insta"><label for="insta">Instagram <em>(opcional)</em></label><input id="insta" autocomplete="off" autocapitalize="off" placeholder="@seuperfil" value="${esc(a.insta || "")}"><div class="err"></div></div>
      <div class="actions"><button class="btn" type="submit">Fazer check-in <span class="arr">→</span></button></div>
    </form></section>`;
  const w = $("#whats");
  w.addEventListener("input", () => {
    let d = w.value.replace(/\D/g, "").slice(0, 11);
    w.value = d.length > 6 ? `(${d.slice(0, 2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}` : d.length > 2 ? `(${d.slice(0, 2)}) ${d.slice(2)}` : d;
  });
  $("#idade").addEventListener("input", e => e.target.value = e.target.value.replace(/\D/g, ""));
  if (!a.nome) setTimeout(() => $("#nome").focus({ preventScroll: true }), 300);
  $("#f").onsubmit = e => {
    e.preventDefault();
    const v = { nome: $("#nome").value.trim(), idade: $("#idade").value.trim(), prof: $("#prof").value.trim(), whats: w.value.trim(), insta: $("#insta").value.trim().replace(/^@?/, "") };
    const errs = {};
    if (v.nome.length < 2) errs.nome = "Digite seu nome.";
    const age = +v.idade; if (!age || age < 14 || age > 90) errs.idade = "Idade entre 14 e 90.";
    if (v.prof.length < 2) errs.prof = "Conta rapidinho o que você faz.";
    if (v.whats.replace(/\D/g, "").length < 10) errs.whats = "Digite o número com DDD.";
    document.querySelectorAll(".field").forEach(f => { const m = errs[f.dataset.f] || ""; f.classList.toggle("bad", !!m); f.querySelector(".err").textContent = m; });
    if (Object.keys(errs).length) { const first = document.querySelector(".field.bad input"); if (first) first.focus(); return; }
    if (v.insta) v.insta = "@" + v.insta;
    withBadgeCheck(() => { S.answers.checkin = v; });
    animateXP(); next();
  };
  bindBack();
}

function reactionFor(q, opt) {
  return (opt && opt.r) || q.r || GENERIC_R[Math.floor(Math.random() * GENERIC_R.length)];
}
function showReact(text) {
  const r = $("#react"); if (!r) return;
  r.innerHTML = `<span class="pill">+XP</span><span>${esc(text)}</span>`;
  requestAnimationFrame(() => r.classList.add("on"));
}

function renderSingle(q) {
  const cur = S.answers[q.id];
  const row = q.layout === "row";
  stage.innerHTML = `<section class="screen">${head(q)}
    <div class="opts ${row ? "row" : ""}" role="group" aria-label="${esc(q.title)}">
      ${q.options.map((o, i) => `<button type="button" class="opt" data-id="${o.id}" aria-pressed="${cur === o.id}"><span class="k">${i + 1}</span>${esc(o.label)}${row ? "<small>dias</small>" : ""}</button>`).join("")}
    </div>
    <div class="react" id="react" aria-live="polite"></div></section>`;
  stage.querySelectorAll(".opt").forEach(b => b.onclick = () => pickSingle(q, b.dataset.id));
  bindBack();
}
function pickSingle(q, id) {
  if (lock) return; lock = true;
  stage.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === id));
  withBadgeCheck(() => { S.answers[q.id] = id; });
  save(); animateXP(); renderHUD();
  showReact(reactionFor(q, q.options.find(o => o.id === id)));
  setTimeout(() => { lock = false; next(); }, 1050);
}

function renderScale(q) {
  const cur = S.answers[q.id];
  stage.innerHTML = `<section class="screen">${head(q)}
    <div class="scale" role="group" aria-label="${esc(q.title)}">
      ${Array.from({ length: 11 }, (_, n) => `<button type="button" class="opt" data-v="${n}" aria-pressed="${cur === n}">${n}</button>`).join("")}
    </div>
    <div class="heat" aria-hidden="true"></div>
    <div class="scale-ends"><span>Sem pressa</span><span>Pra ontem</span></div>
    <div class="react" id="react" aria-live="polite"></div></section>`;
  stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (lock) return; lock = true;
    const v = +b.dataset.v;
    stage.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", x === b));
    withBadgeCheck(() => { S.answers[q.id] = v; });
    save(); animateXP(); renderHUD();
    showReact(v >= 8 ? "Modo foco. Gostei de ver." : v >= 4 ? "Tá esquentando. Bora acelerar isso." : "Sem pressa, mas com direção.");
    setTimeout(() => { lock = false; next(); }, 1050);
  });
  bindBack();
}

function renderMulti(q) {
  const sel = new Set(S.answers[q.id] || []);
  stage.innerHTML = `<section class="screen">${head(q)}
    <div class="opts" role="group" aria-label="${esc(q.title)}">
      ${q.options.map((o, i) => `<button type="button" class="opt" data-id="${o.id}" aria-pressed="${sel.has(o.id)}"><span class="k">${i + 1}</span>${esc(o.label)}</button>`).join("")}
    </div>
    <div class="multi-meta">
      <span class="counter" id="cnt"><b>${sel.size}</b>/${q.max} escolhidos</span>
      <button class="btn" id="ok" type="button" ${sel.size ? "" : "disabled"}>Confirmar <span class="arr">→</span></button>
    </div>
    <div class="react" id="react" aria-live="polite"></div></section>`;
  const sync = () => {
    stage.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", sel.has(b.dataset.id)));
    $("#cnt").innerHTML = `<b>${sel.size}</b>/${q.max} escolhidos`;
    $("#ok").disabled = !sel.size;
  };
  stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if (sel.has(id)) sel.delete(id);
    else { if (sel.size >= q.max) sel.delete([...sel][0]); sel.add(id); }
    sync();
  });
  $("#ok").onclick = () => {
    if (lock || !sel.size) return; lock = true;
    const order = q.options.map(o => o.id).filter(id => sel.has(id));
    withBadgeCheck(() => { S.answers[q.id] = order; });
    save(); animateXP(); renderHUD(); showReact(q.r);
    setTimeout(() => { lock = false; next(); }, 1050);
  };
  bindBack();
}

function renderText(q) {
  const cur = S.answers[q.id] || "";
  stage.innerHTML = `<section class="screen">${head(q)}
    <div class="field"><label for="txt">Seu recado</label><textarea id="txt" maxlength="600" placeholder="${esc(q.placeholder)}">${esc(cur)}</textarea></div>
    <div class="actions">
      <button class="btn" id="send" type="button">Finalizar ficha <span class="arr">→</span></button>
      <button class="link" id="skip" type="button">Pular e finalizar</button>
    </div></section>`;
  const finish = txt => {
    if (lock) return;
    withBadgeCheck(() => { S.answers[q.id] = txt; S.finished = true; });
    animateXP(); go("result");
  };
  $("#send").onclick = () => finish($("#txt").value.trim());
  $("#skip").onclick = () => finish("");
  bindBack();
}

function next() {
  const q = Q[S.qi], nq = Q[S.qi + 1];
  if (!nq) return go("result");
  if (nq.phase !== q.phase && !S.cleared.includes(q.phase)) {
    withBadgeCheck(() => { S.cleared.push(q.phase); });
    animateXP();
    return go("cleared", { clearedPhase: q.phase });
  }
  go("question", { qi: S.qi + 1 });
}

function renderCleared() {
  const p = S.clearedPhase, d = PHASES[p].done;
  const got = earned();
  stage.innerHTML = `<section class="screen cleared">
    <div class="eyebrow">Fase ${p + 1} de ${PHASES.length} concluída</div>
    <div class="big-num" aria-hidden="true">${String(p + 1).padStart(2, "0")}</div>
    <h1>${esc(d.title)}</h1>
    <p class="line">${esc(d.line)}</p>
    <div class="bonus">
      <span class="chip"><b>+${PHASE_BONUS} XP</b> bônus de fase</span>
      ${got.map(k => `<span class="chip badge">${esc(BADGES[k].name)}</span>`).join("")}
    </div>
    <div class="actions"><button class="btn" id="cont" type="button">Próxima fase: ${esc(PHASES[p + 1].name)} <span class="arr">→</span></button></div>
  </section>`;
  $("#cont").onclick = () => go("question", { qi: S.qi + 1 });
  setTimeout(() => $("#cont") && $("#cont").focus({ preventScroll: true }), 400);
}

/* ---------- pontuação de qualificação (uso interno do Wilkson) ---------- */
function leadScore(a) {
  let s = 0;
  s += Math.round((a.urgencia ?? 0) * 2.5);                                                  // até 25
  s += { lt200: 3, "200_500": 10, "501_700": 16, "701_1000": 20, "1001_1500": 23, gt1500: 25 }[a.investimento] || 0; // até 25
  s += { agora: 20, mes: 15, proximo: 8, pesquisando: 2 }[a.inicio] || 0;                    // até 20
  s += { 2: 4, 3: 7, 4: 9, 5: 10 }[a.dias] || 0;                                             // até 10
  s += { online: 10, online_call: 10, hibrido: 7, presencial: 3 }[a.formato] || 0;           // até 10
  s += { bom: 10, nunca: 7, ruim: 5 }[a.historico] || 0;                                     // até 10
  return Math.min(100, s);
}
function tier(score) { return score >= 70 ? "A" : score >= 45 ? "B" : "C"; }
function label(qid, id) { const q = Q.find(x => x.id === qid); const o = q && q.options && q.options.find(x => x.id === id); return o ? o.label : ""; }
function makeCode(t) {
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let r = ""; for (let i = 0; i < 3; i++) r += abc[Math.floor(Math.random() * abc.length)];
  return `WD-${t}${r}`;
}

function summaryLines(a) {
  const c = a.checkin || {};
  return [
    `Nome: ${c.nome}, ${c.idade} anos`,
    `Profissão: ${c.prof || "-"}`,
    `WhatsApp: ${c.whats}`,
    c.insta ? `Instagram: ${c.insta}` : null,
    `Missão: ${label("objetivo", a.objetivo)}`,
    `Prazo pra resultado: ${label("prazo", a.prazo)}`,
    `Urgência: ${a.urgencia}/10`,
    `Treino hoje: ${label("nivel", a.nivel)}`,
    `Rotina: ${label("rotina", a.rotina)}`,
    `Onde treinaria: ${label("local", a.local)}`,
    `Dias por semana: ${label("dias", a.dias)}`,
    `Saúde: ${label("saude", a.saude)}`,
    `Chefões: ${(a.chefoes || []).map(id => label("chefoes", id)).join("; ")}`,
    `Acompanhamento online antes: ${label("historico", a.historico)}`,
    `Formato: ${label("formato", a.formato)}`,
    `Renda mensal: ${label("renda", a.renda)}`,
    `Investimento mensal (academia + personal): ${label("investimento", a.investimento)}`,
    `Começar: ${label("inicio", a.inicio)}`,
    a.recado ? `Recado: ${a.recado}` : null
  ].filter(Boolean);
}

function sendWebhook(payload) {
  if (!CONFIG.webhook || S.sent) return;
  S.sent = true; save();
  try {
    fetch(CONFIG.webhook, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) }).catch(() => { S.sent = false; save(); });
  } catch (e) { S.sent = false; save(); }
}

function sendEmail(score, t, prof, xp) {
  const st = $("#mailst");
  if (!CONFIG.email) { if (st) st.hidden = true; return; }
  const setSt = (txt, retry) => {
    if (!st) return;
    st.innerHTML = esc(txt) + (retry ? ' <button class="link" id="mailretry" type="button">Tentar de novo</button>' : "");
    const r = $("#mailretry"); if (r) r.onclick = () => sendEmail(score, t, prof, xp);
  };
  if (S.mailed) return setSt("Ficha enviada por e-mail para o Wilkson.");
  setSt("Enviando sua ficha para o Wilkson...");
  const a = S.answers, c = a.checkin || {};
  const temp = { A: "quente", B: "morno", C: "frio" }[t];
  const body = {
    _subject: `Nova ficha ${S.code} · ${c.nome} · lead ${temp} (${score} pts)`,
    _template: "table",
    _captcha: "false",
    "Código da ficha": S.code,
    "Lead score": `${score}/100 (${temp})`,
    "Perfil": `${prof.name} · ${xp} XP`,
    "Nome": c.nome, "Idade": c.idade, "WhatsApp": c.whats, "Instagram": c.insta || "-", "Profissão": c.prof || "-",
    "Missão": label("objetivo", a.objetivo),
    "Prazo pra resultado": label("prazo", a.prazo),
    "Urgência": `${a.urgencia}/10`,
    "Treino hoje": label("nivel", a.nivel),
    "Rotina": label("rotina", a.rotina),
    "Onde treinaria": label("local", a.local),
    "Dias por semana": label("dias", a.dias),
    "Saúde": label("saude", a.saude),
    "Chefões": (a.chefoes || []).map(id => label("chefoes", id)).join("; "),
    "Acompanhamento online antes": label("historico", a.historico),
    "Formato preferido": label("formato", a.formato),
    "Renda mensal": label("renda", a.renda),
    "Investimento mensal (academia + personal)": label("investimento", a.investimento),
    "Quando quer começar": label("inicio", a.inicio),
    "Recado": a.recado || "-",
    "Enviado em": new Date().toLocaleString("pt-BR")
  };
  fetch(`https://formsubmit.co/ajax/${encodeURI(CONFIG.email.trim())}`, {
    method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(body)
  }).then(r => r.json()).then(j => {
    if (j && (j.success === true || j.success === "true")) { S.mailed = true; save(); setSt("Ficha enviada por e-mail para o Wilkson."); }
    else throw new Error((j && j.message) || "falha");
  }).catch(() => setSt("Não deu pra enviar o e-mail agora. Verifique a conexão.", true));
}

function renderResult() {
  const a = S.answers, c = a.checkin || {};
  const score = leadScore(a), t = tier(score);
  if (!S.code) { S.code = makeCode(t); save(); }
  const prof = PROFILES[a.nivel] || PROFILES.irregular;
  const xp = totalXP();
  const firstName = (c.nome || "Atleta").split(/\s+/)[0];
  const urg = a.urgencia ?? 0;

  sendWebhook({
    enviadoEm: new Date().toISOString(), codigo: S.code, leadScore: score, tier: t, xp, perfil: prof.name,
    contato: c, respostas: {
      objetivo: label("objetivo", a.objetivo), prazo: label("prazo", a.prazo), urgencia: urg, nivel: label("nivel", a.nivel), rotina: label("rotina", a.rotina),
      local: label("local", a.local), dias: label("dias", a.dias), saude: label("saude", a.saude),
      chefoes: (a.chefoes || []).map(id => label("chefoes", id)), historico: label("historico", a.historico),
      formato: label("formato", a.formato), renda: label("renda", a.renda), investimento: label("investimento", a.investimento), inicio: label("inicio", a.inicio), recado: a.recado || ""
    }
  });

  const msg = [`*Ficha de Atleta ${S.code}*`, `Perfil: ${prof.name} · ${xp} XP`, "", ...summaryLines(a)].join("\n");
  const wa = `https://wa.me/${CONFIG.whatsapp.replace(/\D/g, "")}?text=${encodeURIComponent(msg)}`;
  const badges = earned();

  stage.innerHTML = `<section class="screen">
    <div class="eyebrow">Ficha completa</div>
    <h1>Perfil destravado, ${esc(firstName)}.</h1>
    <article class="card" aria-label="Seu perfil de atleta">
      <div class="card-top">
        <div class="card-kicker"><span>Perfil de atleta</span><span>Nível · ${esc(level(xp))}</span></div>
        <div class="card-name">${esc(c.nome || "Atleta")}</div>
        <div class="card-profile">${esc(prof.name)}</div>
      </div>
      <div class="card-body">
        <p class="card-desc">${esc(prof.desc)}</p>
        <dl class="stat-grid">
          <div class="stat"><dt>Missão</dt><dd>${esc(label("objetivo", a.objetivo))}</dd></div>
          <div class="stat"><dt>Prazo</dt><dd>${esc(label("prazo", a.prazo))}</dd></div>
          <div class="stat"><dt>Chefão nº 1</dt><dd>${esc(label("chefoes", (a.chefoes || [])[0]) || "-")}</dd></div>
          <div class="stat"><dt>Disponibilidade</dt><dd>${esc(label("dias", a.dias))} dias · ${esc(label("local", a.local))}</dd></div>
          <div class="stat"><dt>Profissão</dt><dd>${esc(c.prof || "-")}</dd></div>
          <div class="stat"><dt>Urgência ${urg}/10</dt><dd><div class="meter" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => `<i class="${i < urg ? "on" : ""}"></i>`).join("")}</div></dd></div>
        </dl>
        <div class="badges">${badges.map(k => `<span class="chip badge">${esc(BADGES[k].name)}</span>`).join("")}</div>
        <div class="card-foot">
          <div class="xpbig">${xp}<span>de ${maxXP()} XP</span></div>
          <div class="code">${esc(S.code)}</div>
        </div>
      </div>
    </article>
    <p class="note mailst" id="mailst" aria-live="polite"></p>
    <p class="note">Último passo: envie sua ficha pro Wilkson no WhatsApp. Ele analisa suas respostas e volta com uma proposta feita pra sua rotina.</p>
    <div class="actions">
      <a class="btn" id="wa" href="${wa}" target="_blank" rel="noopener">Enviar ficha pro Wilkson <span class="arr">→</span></a>
      <button class="link" id="redo" type="button">Refazer ficha</button>
    </div>
  </section>`;
  sendEmail(score, t, prof, xp);
  $("#redo").onclick = () => { clearSave(); S = { screen: "intro", qi: 0, answers: {}, cleared: [], finished: false, sent: false, mailed: false, code: null }; shownXP = 0; $("#xp").textContent = "0"; render(); };
}

/* ---------- teclado: 1-9 escolhe, Enter confirma ---------- */
document.addEventListener("keydown", e => {
  if (S.screen !== "question" || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  const q = Q[S.qi];
  if (/^[0-9]$/.test(e.key)) {
    if (q.type === "scale") { const b = stage.querySelector(`.opt[data-v="${e.key}"]`); if (b) b.click(); return; }
    const b = stage.querySelectorAll(".opt")[+e.key - 1]; if (b) b.click();
  } else if (e.key === "Enter" && q.type === "multi") { const ok = $("#ok"); if (ok && !ok.disabled) ok.click(); }
});

/* ---------- início ---------- */
function start(data) {
  if (data && data.S) { S = data.S; }
  render();
  if (S.screen !== "intro") animateXP();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
